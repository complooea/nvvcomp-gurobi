[project]
name = "nvvcomp-gurobi"
version = "0.1.0"
description = "Gurobi-based verification experiments on VNN-COMP 2026 benchmarks"
readme = "README.md"
authors = [
    { name = "Qingcheng Xu", email = "complooea@icloud.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B", "UP", "RUF100",
    "PT011", "PT012", "BLE001", "PGH004", "RUF102", "PLW0177",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
strict = true

[tool.coverage.run]
branch = true
source = ["nvvcomp_gurobi"]

[tool.coverage.report]
show_missing = true

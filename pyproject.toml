[project]
name = "nvvcomp-gurobi"
version = "0.1.0"
description = "Gurobi-based verification experiments on VNN-COMP 2026 benchmarks"
readme = "README.md"
authors = [
    { name = "Qingcheng Xu", email = "complooea@icloud.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "onnx==1.21.0",
    "onnxruntime==1.26.0",
    "cachier==2.2.2",
]

[project.optional-dependencies]
solver = ["gurobipy==13.0.1", "gurobi-machinelearning==1.7.0"]

[project.scripts]
nvvcomp-gurobi = "nvvcomp_gurobi.competition:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/nvvcomp_gurobi/_vendor"]

# Upstream replay code is preserved, not maintained or retyped here.
[tool.ty.src]
exclude = ["src/nvvcomp_gurobi/_vendor"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B", "UP", "RUF100",
    "PT011", "PT012", "BLE001", "PGH004", "RUF102", "PLW0177",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
strict = true
markers = ["solver: requires the pinned Gurobi integration and bundled license"]

[tool.coverage.run]
branch = true
source = ["nvvcomp_gurobi"]
patch = ["subprocess"]
omit = ["*/_vendor/*"]

[tool.coverage.report]
show_missing = true

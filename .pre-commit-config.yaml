# Preserve upstream source, fixtures, and hash-pinned comparison reference bytes.
# The comparison snapshots are data, never imported or executed as project code.
exclude: ^(src/nvvcomp_gurobi/_vendor/(counterexamples\.py|vnnlib_v1\.py)|tests/fixtures/runner/run_instances\.sh|experiments/[^/]+-comparison/published/raw/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
      - id: ty
        args: [--locked, --extra, solver]
